<svg xmlns="http://www.w3.org/2000/svg" id="cm-front" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Front elevation of the A5 comparator mirror: the overhang leaf reads as a band across the top of the notebook, with the small circular mirror hanging just below it on a short rod.">
  <style>
    #cm-front .fx{fill:#16150F;stroke:#F5F1E9;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    #cm-front .hair{fill:none;stroke:#9C988E;stroke-width:1;stroke-linecap:round}
    #cm-front .lead{fill:none;stroke:#9C988E;stroke-width:1;stroke-linecap:round}
    #cm-front .hidden{fill:none;stroke:#9C988E;stroke-width:1.2;stroke-dasharray:6 6}
    #cm-front .dim{fill:none;stroke:#9C988E;stroke-width:1}
    #cm-front .t{font-family:'Space Mono',ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:1.1px;fill:#A9A49A}
  </style>
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8 Z" fill="#9C988E"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="359" rx="18" fill="#1B1A13" stroke="#EBE7DF" stroke-opacity="0.14"/>

  <!-- clamp plate, hidden behind the notebook -->
  <rect class="hidden" x="163" y="66" width="154" height="223"/>

  <!-- notebook, front on -->
  <rect class="fx" x="160" y="70" width="160" height="221" rx="3"/>
  <g class="hair" opacity="0.7">
    <line x1="176" y1="120" x2="304" y2="120"/>
    <line x1="176" y1="146" x2="304" y2="146"/>
    <line x1="176" y1="172" x2="304" y2="172"/>
    <line x1="176" y1="198" x2="304" y2="198"/>
    <line x1="176" y1="224" x2="304" y2="224"/>
    <line x1="176" y1="250" x2="304" y2="250"/>
  </g>

  <!-- the leaf projects straight at us: only its edge shows -->
  <rect class="fx" x="158" y="60" width="164" height="10" rx="3"/>

  <!-- rod, foreshortened to its drop; mirror tilted 45 degrees so it reads as an ellipse -->
  <rect class="fx" x="237.5" y="70" width="5" height="34"/>
  <ellipse class="fx" cx="240" cy="115" rx="19.5" ry="14"/>
  <ellipse cx="240" cy="115" rx="17" ry="12" fill="#FACA47" stroke="#F5F1E9" stroke-width="1.8"/>

  <!-- dimensions -->
  <g class="dim">
    <line x1="160" y1="56" x2="160" y2="34"/>
    <line x1="320" y1="56" x2="320" y2="34"/>
    <line x1="160" y1="42" x2="320" y2="42" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="324" y1="70" x2="368" y2="70"/>
    <line x1="324" y1="291" x2="368" y2="291"/>
    <line x1="360" y1="70" x2="360" y2="291" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <text class="t" x="240" y="32" text-anchor="middle">148</text>
  <text class="t" x="352" y="180" text-anchor="middle" transform="rotate(-90 352 180)">210</text>

  <!-- callouts -->
  <path class="lead" d="M200 65 L158 44"/>
  <text class="t" x="154" y="48" text-anchor="end">LEAF EDGE ON</text>

  <path class="lead" d="M222 121 L150 150"/>
  <text class="t" x="146" y="154" text-anchor="end">&#216;34 MIRROR</text>

  <path class="lead" d="M163 204 L154 204"/>
  <text class="t" x="150" y="208" text-anchor="end">PLATE BEHIND</text>

  <text class="t" x="34" y="344">FRONT ELEVATION</text>
</svg>
